[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-crowdsensing"
version = "1.0.0"
description = "Proteus: a system for combining paths collected using crowdsensing (GeoInformatica 2026)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raunak Sarbajna" }, { name = "Christoph F. Eick" }, { name = "Jianyuan Ni" }]
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "networkx>=3.0"]

[project.optional-dependencies]
analysis = ["statsmodels>=0.14", "matplotlib>=3.6"]
osm = ["osmnx>=1.9"]
dev = ["pytest>=7", "statsmodels>=0.14", "matplotlib>=3.6"]

[project.scripts]
proteus = "proteus.cli:main"

[tool.setuptools]
packages = ["proteus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
